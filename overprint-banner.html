<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Permissions-Policy" content="accelerometer=*, gyroscope=*, magnetometer=*">
<title>Overprint — 3D Logo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#050505;overflow:hidden;cursor:default}
canvas{display:block;touch-action:none}
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============================================
// SCENE
// ============================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050505);

const useGyroTilt =
  typeof navigator !== 'undefined' &&
  (navigator.maxTouchPoints > 0 || window.matchMedia('(pointer: coarse)').matches);
const mobileLogoBoost = useGyroTilt ? 1.08 : 1;
let inIframe = false;
try {
  inIframe = window.self !== window.top;
} catch (e) {
  inIframe = true;
}
const iframeEmbedBoost = inIframe ? 1.2 : 1;

const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
const baseCamZ = useGyroTilt ? 9.35 : 8.1;
camera.position.set(0, 0, inIframe ? baseCamZ * 0.82 : baseCamZ);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
document.body.appendChild(renderer.domElement);

const raycaster = new THREE.Raycaster();
const mouseNDC = new THREE.Vector2();
const ndcSlideA = new THREE.Vector3();
const ndcSlideB = new THREE.Vector3();
const ndcSlideDelta = new THREE.Vector2();

// ============================================
// LIGHTING
// ============================================
const ambientLight = new THREE.AmbientLight(0x404050, 0.6);
scene.add(ambientLight);
const kl = new THREE.DirectionalLight(0xffeedd, 1.5); kl.position.set(3, 5, 5); scene.add(kl);
const fl = new THREE.DirectionalLight(0xaaccff, 0.5); fl.position.set(-4, 2, 3); scene.add(fl);
const rl = new THREE.DirectionalLight(0xffffff, 0.7); rl.position.set(0, -1, -4); scene.add(rl);
const tl = new THREE.DirectionalLight(0xffffff, 0.3); tl.position.set(0, 7, 0); scene.add(tl);

// ============================================
// RHOMBUS — smooth rounded corners, NO bevel notch
// Uses rounded rectangle shape with skew applied via vertex manipulation
// ============================================
function createRhombus(width, height, depth) {
  const r = 0.045;
  const hw = width / 2;
  const hh = height / 2;

  const shape = new THREE.Shape();
  shape.moveTo(-hw + r, -hh);
  shape.lineTo(hw - r, -hh);
  shape.quadraticCurveTo(hw, -hh, hw, -hh + r);
  shape.lineTo(hw, hh - r);
  shape.quadraticCurveTo(hw, hh, hw - r, hh);
  shape.lineTo(-hw + r, hh);
  shape.quadraticCurveTo(-hw, hh, -hw, hh - r);
  shape.lineTo(-hw, -hh + r);
  shape.quadraticCurveTo(-hw, -hh, -hw + r, -hh);

  const geo = new THREE.ExtrudeGeometry(shape, {
    steps: 1,
    depth: depth,
    bevelEnabled: true,
    bevelThickness: 0.014,
    bevelSize: 0.014,
    bevelSegments: 8
  });

  const skewAmount = Math.tan(12 * Math.PI / 180);
  const positions = geo.attributes.position;
  for (let i = 0; i < positions.count; i++) {
    const y = positions.getY(i);
    const x = positions.getX(i);
    positions.setX(i, x + y * skewAmount);
  }
  positions.needsUpdate = true;
  geo.computeVertexNormals();

  geo.computeBoundingBox();
  const c = new THREE.Vector3();
  geo.boundingBox.getCenter(c);
  geo.translate(-c.x, -c.y, -c.z);

  return geo;
}

function createMat(color) {
  return new THREE.MeshPhongMaterial({
    color,
    specular: 0x151518,
    shininess: 42,
    emissive: color,
    emissiveIntensity: 0.07
  });
}

const colorData = [
  { color: 0x00cfff, name: 'C' },
  { color: 0xff1493, name: 'M' },
  { color: 0xffd400, name: 'Y' },
  { color: 0xc4c6ce, name: 'K' }
];

const group = new THREE.Group();
const meshes = [];

const sizeScale = 1.32 * mobileLogoBoost * iframeEmbedBoost;
const rw = 0.55 * sizeScale;
const rh = 1.4 * sizeScale;
const rd = 0.28 * sizeScale;
const gap = 0.58 * sizeScale;

const slideAngle = 12 * Math.PI / 180;
const slideDX = Math.sin(slideAngle);
const slideDY = Math.cos(slideAngle);
colorData.forEach((c, i) => {
  const geo = createRhombus(rw, rh, rd);
  const mat = createMat(c.color);
  const mesh = new THREE.Mesh(geo, mat);

  mesh.position.x = (i - 1.5) * gap;
  mesh.position.y = 0;

  mesh.userData.baseX = mesh.position.x;
  mesh.userData.baseY = 0;
  mesh.userData.index = i;
  mesh.userData.slideOffset = 0;
  mesh.userData.targetSlide = 0;
  mesh.userData.userSlide = 0;

  group.add(mesh);
  meshes.push(mesh);
});

group.rotation.x = 0.12;
group.rotation.y = 0.15;
scene.add(group);

function targetSlideFromPointer(baseX, baseY, startX, startY, startSlide, curX, curY) {
  ndcSlideA.set(baseX, baseY, 0);
  ndcSlideB.set(baseX + slideDX, baseY + slideDY, 0);
  group.localToWorld(ndcSlideA);
  group.localToWorld(ndcSlideB);
  ndcSlideA.project(camera);
  ndcSlideB.project(camera);
  ndcSlideDelta.set(ndcSlideB.x - ndcSlideA.x, ndcSlideB.y - ndcSlideA.y);
  const L2 = ndcSlideDelta.lengthSq();
  if (L2 < 1e-12) return startSlide;
  const dNDCX = ((curX - startX) / window.innerWidth) * 2;
  const dNDCY = -((curY - startY) / window.innerHeight) * 2;
  return startSlide + (dNDCX * ndcSlideDelta.x + dNDCY * ndcSlideDelta.y) / L2 * 1.15;
}

const overlapThreshold = Math.min(0.95, rh * 0.55 + gap * 0.15);

let time = 0;
const neutralHoldSeconds = 3.25;
const motionScale = 1.05;
const idleSpeed = 1.32 * motionScale;
const floatSpeed = 1.42 * motionScale;
const idleAmp = overlapThreshold * 0.42;
const cyclePeriod = (2 * Math.PI) / idleSpeed;
let animState = 'neutral';
let neutralPhaseStartMs = performance.now();
let lifeT = 0;
const playBoostPlaying = 1.35;
const playBoostNeutral = 0.45;
let smoothPlayBoost = playBoostNeutral;
const floatAmp = 0.028;
let floatSmoothY = 0;

function idleSlideAt(index, t) {
  return idleAmp * Math.pow(-1, index + 1) * Math.sin(t * idleSpeed);
}

function enforceCollisions() {
  if (!draggedMesh) return;
  const me = draggedMesh;
  const i = me.userData.index;
  let s = me.userData.slideOffset;
  let t = me.userData.targetSlide;

  if (i > 0) {
    const left = meshes[i - 1];
    const minS = left.userData.slideOffset - overlapThreshold;
    if (s < minS) {
      s = minS;
      t = Math.max(t, minS);
    }
  } else {
    const minS = -overlapThreshold;
    if (s < minS) {
      s = minS;
      t = Math.max(t, minS);
    }
  }
  if (i < meshes.length - 1) {
    const right = meshes[i + 1];
    const maxS = right.userData.slideOffset + overlapThreshold;
    if (s > maxS) {
      s = maxS;
      t = Math.min(t, maxS);
    }
  } else {
    const maxS = overlapThreshold;
    if (s > maxS) {
      s = maxS;
      t = Math.min(t, maxS);
    }
  }
  me.userData.slideOffset = s;
  me.userData.targetSlide = t;
  const idleT = idleSlideAt(i, time);
  me.userData.userSlide = t - idleT;
}

const mouse = { x: 0, y: 0 };
const targetRot = { x: 0.12, y: 0.15 };
const currentRot = { x: 0.12, y: 0.15 };
const maxTilt = 0.55;
const tiltHoriz = 1.05;
const tiltVert = 1.28;

const OVERPRINT_SITE_URL = 'https://overprint.design';
let bgTap = null;

let draggedMesh = null;
let dragStartX = 0;
let dragStartY = 0;
let dragStartSlide = 0;
const canvas = renderer.domElement;

function pickMesh(clientX, clientY) {
  mouseNDC.set(
    (clientX / window.innerWidth) * 2 - 1,
    -(clientY / window.innerHeight) * 2 + 1
  );
  raycaster.setFromCamera(mouseNDC, camera);
  const hits = raycaster.intersectObjects(meshes);
  return hits.length ? hits[0].object : null;
}

function updateMouseTilt(clientX, clientY) {
  mouse.x = (clientX / window.innerWidth) * 2 - 1;
  mouse.y = (clientY / window.innerHeight) * 2 - 1;
  targetRot.y = 0.15 + mouse.x * maxTilt * tiltHoriz;
  targetRot.x = 0.12 + mouse.y * maxTilt * tiltVert;
}

canvas.addEventListener('pointerdown', (e) => {
  const m = pickMesh(e.clientX, e.clientY);
  if (m) {
    bgTap = null;
    draggedMesh = m;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    dragStartSlide = m.userData.slideOffset;
    canvas.style.cursor = 'grabbing';
    canvas.setPointerCapture(e.pointerId);
    return;
  }
  bgTap = { x: e.clientX, y: e.clientY, time: performance.now(), pointerId: e.pointerId };
});

canvas.addEventListener('pointermove', (e) => {
  if (bgTap && (Math.abs(e.clientX - bgTap.x) > 10 || Math.abs(e.clientY - bgTap.y) > 10)) {
    bgTap = null;
  }
  if (!useGyroTilt) {
    updateMouseTilt(e.clientX, e.clientY);
  }
  if (!draggedMesh) return;
  e.preventDefault();
  const i = draggedMesh.userData.index;
  const idleNow = idleSlideAt(i, time);
  const totalWant = targetSlideFromPointer(
    draggedMesh.userData.baseX,
    draggedMesh.userData.baseY,
    dragStartX,
    dragStartY,
    dragStartSlide,
    e.clientX,
    e.clientY
  );
  draggedMesh.userData.userSlide = totalWant - idleNow;
}, { passive: false });

function endDrag() {
  draggedMesh = null;
  canvas.style.cursor = 'default';
}

canvas.addEventListener('pointerup', (e) => {
  if (draggedMesh) {
    try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
    endDrag();
    return;
  }
  if (bgTap && bgTap.pointerId === e.pointerId) {
    const dx = e.clientX - bgTap.x;
    const dy = e.clientY - bgTap.y;
    const moved = dx * dx + dy * dy > 100;
    const dt = performance.now() - bgTap.time;
    bgTap = null;
    if (!moved && dt < 900) {
      window.open(OVERPRINT_SITE_URL, '_blank', 'noopener,noreferrer');
    }
  }
  endDrag();
});

canvas.addEventListener('pointercancel', () => {
  bgTap = null;
  endDrag();
});

function resetTiltToDefault() {
  if (draggedMesh) return;
  targetRot.x = 0.12;
  targetRot.y = 0.15;
  endDrag();
}
canvas.addEventListener('pointerleave', () => {
  bgTap = null;
  if (useGyroTilt) return;
  resetTiltToDefault();
});

let gyroAttached = false;
let gyroPermissionPending = false;
function attachGyroListener() {
  if (gyroAttached) return;
  window.addEventListener('deviceorientation', handleGyro, { passive: true });
  gyroAttached = true;
}
function requestGyroPermission() {
  if (gyroAttached) return;
  if (typeof DeviceOrientationEvent === 'undefined') return;
  if (typeof DeviceOrientationEvent.requestPermission === 'function') {
    if (!window.isSecureContext) return;
    if (gyroPermissionPending) return;
    gyroPermissionPending = true;
    DeviceOrientationEvent.requestPermission()
      .then((state) => {
        gyroPermissionPending = false;
        if (state === 'granted') attachGyroListener();
      })
      .catch(() => {
        gyroPermissionPending = false;
      });
  } else {
    attachGyroListener();
  }
}
function tryEnableGyroFromGesture() {
  if (!useGyroTilt) return;
  requestGyroPermission();
}
if (useGyroTilt && typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission !== 'function') {
  attachGyroListener();
}
const gyroGestureOpts = { passive: true, capture: true };
['touchstart', 'touchend', 'pointerdown', 'pointerup', 'click'].forEach((ev) => {
  canvas.addEventListener(ev, tryEnableGyroFromGesture, gyroGestureOpts);
  document.documentElement.addEventListener(ev, tryEnableGyroFromGesture, gyroGestureOpts);
});
function handleGyro(e) {
  if (!useGyroTilt) return;
  if (draggedMesh) return;
  const g = e.gamma;
  const b = e.beta;
  if (!Number.isFinite(g) || !Number.isFinite(b)) return;
  const gx = Math.max(-45, Math.min(45, g)) / 45;
  const gy = Math.max(-45, Math.min(45, b - 45)) / 45;
  targetRot.y = 0.15 + gx * maxTilt * tiltHoriz;
  targetRot.x = 0.12 + gy * maxTilt * tiltVert;
}

let lastFrameMs = performance.now();
function lerpAlpha(frameTuning, dt) {
  const a = Math.min(frameTuning, 1);
  return 1 - Math.pow(1 - a, dt * 60);
}

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  let dt = (now - lastFrameMs) / 1000;
  lastFrameMs = now;
  if (dt > 0.12) dt = 0.12;
  if (dt <= 0) dt = 1 / 60;
  const tick = dt * 60;

  if (animState === 'neutral') {
    time = 0;
    if ((now - neutralPhaseStartMs) / 1000 >= neutralHoldSeconds) {
      animState = 'playing';
      time = 0;
    }
  } else {
    time += 0.016 * motionScale * tick;
    if (time >= cyclePeriod) {
      animState = 'neutral';
      neutralPhaseStartMs = now;
      time = 0;
    }
  }

  lifeT += 0.016 * motionScale * tick;
  const boostTarget = animState === 'playing' ? playBoostPlaying : playBoostNeutral;
  smoothPlayBoost += (boostTarget - smoothPlayBoost) * lerpAlpha(0.09, dt);
  const playBoost = smoothPlayBoost;
  const breathe = 1 + 0.006 * playBoost * Math.sin(lifeT * 0.52);
  const swayX = Math.sin(lifeT * 0.41) * 0.012 * playBoost;
  const swayY = Math.cos(lifeT * 0.33) * 0.01 * playBoost;
  const swayZ = Math.sin(lifeT * 0.27) * 0.014 * playBoost;
  ambientLight.intensity = 0.58 + 0.06 * playBoost * Math.sin(lifeT * 0.38);

  const rotA = lerpAlpha(0.04, dt);
  currentRot.x += (targetRot.x - currentRot.x) * rotA;
  currentRot.y += (targetRot.y - currentRot.y) * rotA;
  group.rotation.x = currentRot.x + swayX;
  group.rotation.y = currentRot.y + swayY;
  group.rotation.z = swayZ;
  group.scale.setScalar(breathe);

  const userSlideA = lerpAlpha(0.11, dt);
  const slideFollowA = lerpAlpha(0.092, dt);
  meshes.forEach((m, i) => {
    const idleT = idleSlideAt(i, time);
    if (draggedMesh !== m) {
      m.userData.userSlide += (0 - m.userData.userSlide) * userSlideA;
    }
    m.userData.targetSlide = idleT + m.userData.userSlide;
  });

  meshes.forEach(m => {
    m.userData.slideOffset += (m.userData.targetSlide - m.userData.slideOffset) * slideFollowA;
  });

  enforceCollisions();

  meshes.forEach(m => {
    m.position.x = m.userData.baseX + m.userData.slideOffset * slideDX;
    m.position.y = m.userData.baseY + m.userData.slideOffset * slideDY;
  });

  const floatTarget =
    animState === 'playing' ? Math.sin(time * floatSpeed) * floatAmp : 0;
  floatSmoothY += (floatTarget - floatSmoothY) * lerpAlpha(0.14, dt);
  group.position.y = floatSmoothY;

  renderer.render(scene, camera);
}

animate();

function onResize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  if (w < 2 || h < 2) return;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', onResize);
onResize();
requestAnimationFrame(onResize);
requestAnimationFrame(() => {
  requestAnimationFrame(onResize);
});
</script>
</body>
</html>
