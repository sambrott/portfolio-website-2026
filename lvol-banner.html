<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lady Vols Banner</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0a;}
.banner-wrap{width:100%;height:100%;position:relative;display:block;}
canvas{position:absolute;top:0;left:0;width:100%;height:100%;display:block;}
</style>
</head>
<body>
<div class="banner-wrap" id="wrap"><canvas id="c"></canvas></div>
<script>
(function(){
  const wrap=document.getElementById('wrap');
  const c=document.getElementById('c');
  const gl=c.getContext('webgl');
  if(!gl){document.body.innerHTML='<p style="color:red;padding:20px">WebGL not supported</p>';return;}

  const DEFAULTS={
    u_freq:1.38,u_warp:5.4,u_scale:1.35,u_cross:0.4,u_angle:0.8,u_speed:0.19,u_wspeed:0.155,
    u_cw:0.12,u_ow:0.235,u_bor:0.44,u_bx:0.072,u_rough:0.08,u_jag:40.0,u_dark:0.45,u_lp:0.72,u_ls:0.45
  };

  const VS='attribute vec2 p;varying vec2 uv;void main(){ uv=p*.5+.5; gl_Position=vec4(p,0,1); }';

  const FS=`precision highp float;
varying vec2 uv;
uniform float t;
uniform vec2  res;
uniform float u_freq,u_warp,u_scale,u_cross,u_angle,u_speed,u_wspeed;
uniform float u_cw,u_ow,u_bor;
uniform float u_bx,u_rough,u_jag;
uniform float u_dark,u_lp,u_ls;

vec2 hash2(vec2 p){
  p=vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3)));
  return fract(sin(p)*43758.5453);
}
float vnoise(vec2 p){
  vec2 i=floor(p),f=fract(p),u=f*f*(3.-2.*f);
  float a=dot(hash2(i),          f-vec2(0,0));
  float b=dot(hash2(i+vec2(1,0)),f-vec2(1,0));
  float cc=dot(hash2(i+vec2(0,1)),f-vec2(0,1));
  float d=dot(hash2(i+vec2(1,1)),f-vec2(1,1));
  return mix(mix(a,b,u.x),mix(cc,d,u.x),u.y)*.5+.5;
}

float roughBorder(vec2 suv, float bx, float by){
  float dx=min(suv.x-bx,(1.0-bx)-suv.x);
  float dy=min(suv.y-by,(1.0-by)-suv.y);
  float sdf=min(dx,dy);
  float n1=vnoise(suv*u_jag*0.55+vec2(13.7,42.1))*2.0-1.0;
  float n2=vnoise(suv*u_jag*1.2 +vec2(88.3,17.4))*2.0-1.0;
  float n3=vnoise(suv*u_jag*2.8 +vec2(33.1,71.9))*2.0-1.0;
  float n4=vnoise(suv*u_jag*5.1 +vec2(57.2,24.8))*2.0-1.0;
  float noise=n1*0.45+n2*0.28+n3*0.18+n4*0.09;
  return smoothstep(-0.003,0.003,sdf-noise*u_rough);
}

vec3 blueBg(vec2 p){
  float d=distance(p,vec2(0.5,0.48));
  float r=clamp(d/u_lp,0.0,1.0);
  vec3 cC=mix(vec3(0.714,0.894,1.000),vec3(0.18,0.50,0.88),u_dark);
  vec3 cM=mix(vec3(0.322,0.714,1.000),vec3(0.09,0.34,0.72),u_dark);
  vec3 cE=mix(vec3(0.110,0.510,0.902),vec3(0.03,0.18,0.55),u_dark);
  vec3 col=mix(cC,cM,smoothstep(0.0,0.55,r));
      col=mix(col,cE,smoothstep(0.45,1.0,r));
  col+=vec3(1.0)*(1.0-smoothstep(0.0,u_lp*0.48,d))*u_ls*0.16;
  vec2 gp=floor(p*res*0.85);
  float g=fract(sin(dot(gp,vec2(127.1,311.7)))*43758.5453)-0.5;
  col+=vec3(g*0.040);
  return clamp(col,0.0,1.0);
}

vec3 swirlColor(vec2 q){
  float ws=u_wspeed,s=u_scale;
  vec2 w1=vec2(
    vnoise(q*s+vec2(t*ws,        t*ws*.7)),
    vnoise(q*s+vec2(t*ws*.7+4.7, t*ws+2.3))
  );
  vec2 w2=vec2(
    vnoise(q*s+w1*1.9+vec2(t*ws*.6+8.2,t*ws*.8+1.4)),
    vnoise(q*s+w1*1.9+vec2(t*ws*.8+3.1,t*ws*.6+7.9))
  );
  vec2 w3=vec2(
    vnoise(q*s*1.8+w2*2.1+vec2(t*ws*.4+5.5,t*ws*.5+9.1)),
    vnoise(q*s*1.8+w2*2.1+vec2(t*ws*.5+0.8,t*ws*.4+4.4))
  );
  float diag=q.x*u_angle+q.y*(2.0-u_angle);
  float prim=diag+(w3.x-.5)*u_warp+(w3.y-.5)*u_warp*.85;
  float cf=q.x*(2.0-u_angle)-q.y*u_angle;
  float sec=cf+(w3.y-.5)*u_warp*.7+(w3.x-.5)*u_warp*.55;
  float bm=vnoise(q*1.1+vec2(t*ws*.5,t*ws*.4));
  float f=fract(mix(prim,sec*.8+prim*.2,bm*u_cross)*u_freq+t*u_speed);
  float s1=u_cw;
  float s2=s1+u_bor*(1.0-u_cw*3.0-u_ow);
  float s3=s2+u_cw;
  float s4=s3+u_ow;
  float s5=s4+u_cw;
  vec3 orange=vec3(0.941,0.494,0.086);
  vec3 blue  =vec3(0.129,0.596,0.784);
  vec3 cream =vec3(0.957,0.929,0.847);
  vec3 col;
  if(f<s1)col=cream;
  else if(f<s2)col=blue;
  else if(f<s3)col=cream;
  else if(f<s4)col=orange;
  else if(f<s5)col=cream;
  else col=blue;
  float aa=0.008;
  float ca=
    (1.-smoothstep(s1-aa,s1+aa,f))+
    smoothstep(s2-aa,s2+aa,f)*(1.-smoothstep(s3-aa,s3+aa,f))+
    smoothstep(s4-aa,s4+aa,f)*(1.-smoothstep(s5-aa,s5+aa,f));
  return mix(col,cream,clamp(ca,0.,1.)*.55);
}

void main(){
  vec2 suv=vec2(uv.x,1.0-uv.y);
  vec2 q=suv*vec2(res.x/res.y,1.0);
  float bx=u_bx;
  float by=u_bx*(res.x/res.y)*0.75;
  float inner=roughBorder(suv,bx,by);
  vec2 ip=vec2((suv.x-bx)/(1.0-bx*2.0),(suv.y-by)/(1.0-by*2.0));
  gl_FragColor=vec4(mix(swirlColor(q),blueBg(ip),inner),1.0);
}`;

  function mk(type,src){
    const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){console.error(gl.getShaderInfoLog(s));return null;}
    return s;
  }
  const prog=gl.createProgram();
  gl.attachShader(prog,mk(gl.VERTEX_SHADER,VS));
  gl.attachShader(prog,mk(gl.FRAGMENT_SHADER,FS));
  gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog,gl.LINK_STATUS)){console.error(gl.getProgramInfoLog(prog));return;}
  gl.useProgram(prog);

  const buf=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const aloc=gl.getAttribLocation(prog,'p');
  gl.enableVertexAttribArray(aloc);
  gl.vertexAttribPointer(aloc,2,gl.FLOAT,false,0,0);

  const uT=gl.getUniformLocation(prog,'t');
  const uRes=gl.getUniformLocation(prog,'res');
  const UL={};
  Object.keys(DEFAULTS).forEach(function(n){UL[n]=gl.getUniformLocation(prog,n);});

  function applyDefaults(){
    Object.keys(DEFAULTS).forEach(function(k){
      gl.uniform1f(UL[k],DEFAULTS[k]);
    });
  }
  applyDefaults();

  new ResizeObserver(function(){
    const W=wrap.offsetWidth,H=wrap.offsetHeight;
    c.width=W;c.height=H;
    gl.viewport(0,0,W,H);
    gl.uniform2f(uRes,W,H);
  }).observe(wrap);

  let start=null;
  (function loop(ts){
    if(!start)start=ts;
    gl.uniform1f(uT,(ts-start)/1000);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    requestAnimationFrame(loop);
  })();
})();
</script>
</body>
</html>
