    <style>
        @font-face {
            font-family: 'Brewhouse';
            src: url('portfolio site assets/bottlecap copy/BrewHouse Aged copy.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        :root {
            --bg: #000;
            --text: #fff;
            --text-muted: #888;
            --border: #222;
            --card-bg: #111;
        }
        [data-theme="light"] {
            --bg: #fff;
            --text: #000;
            --text-muted: #666;
            --border: #e0e0e0;
            --card-bg: #fff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            opacity: 0;
            animation: fadeIn 0.6s ease-in forwards;
            transition: background 0.3s ease, color 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        header {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            background: var(--bg);
            padding: 30px 0;
            border-bottom: none;
            transition: background 0.3s ease;
        }
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
            color: var(--text);
            text-decoration: none;
            font-family: "Helvetica", "Helvetica Neue", Arial, sans-serif;
        }
        nav { display: flex; gap: 30px; align-items: center; }
        nav a {
            color: var(--text);
            text-decoration: none;
            font-size: 15px;
            font-weight: 400;
            transition: opacity 0.3s;
        }
        nav a:hover { opacity: 0.5; }
        main { padding-top: 80px; }
        .projects-grid { display: flex; flex-direction: column; }
        .project-card {
            text-decoration: none;
            color: var(--text);
            display: block;
            cursor: pointer;
            position: relative;
        }
        .project-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(0, 0, 0, 0.6) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 1;
        }
        .project-card:hover::before { opacity: 1; }
        .project-title {
            position: absolute;
            bottom: 32px; left: 32px;
            color: #fff;
            font-size: 36px;
            font-weight: 600;
            letter-spacing: -0.02em;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 2;
            pointer-events: none;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .project-card:hover .project-title { opacity: 1; transform: translateY(0); }
        .award-icons {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .award-icon {
            width: 70px;
            height: 70px;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.5));
        }
        .project-image {
            width: 100%;
            height: 70vh;
            object-fit: cover;
            display: block;
            transition: opacity 0.3s;
        }
        .project-image.lvol-cover { object-position: center center; }
        .banquet-hero {
            background-color: #AE122A;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(10px, 2.5vh, 24px);
        }
        .banquet-hero__frame {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: clamp(16px, 3vh, 60px);
            overflow: hidden;
            text-align: center;
        }
        .banquet-hero__frame::before {
            content: '';
            position: absolute;
            inset: 0;
            border: clamp(5px, 1.2vh, 14px) solid #FAF7F2;
            pointer-events: none;
        }
        .banquet-hero__eyebrow,
        .banquet-hero__tagline {
            font-family: 'Brewhouse', 'UnifrakturMaguntia', cursive;
            font-size: clamp(1.4rem, min(4vw, 5vh), 3.5rem);
            color: #FAF7F2;
            display: flex;
            align-items: center;
            gap: clamp(0.8rem, 2.5vw, 3rem);
            flex-shrink: 0;
            opacity: 0;
        }
        .banquet-hero__eyebrow::after {
            content: '';
            width: clamp(60px, 15vw, 250px);
            height: clamp(2px, 0.4vh, 4px);
            background-color: #FAF7F2;
        }
        .banquet-hero__tagline::before {
            content: '';
            width: clamp(60px, 15vw, 250px);
            height: clamp(2px, 0.4vh, 4px);
            background-color: #FAF7F2;
        }
        .banquet-hero__title-img {
            width: 80%;
            max-width: 700px;
            height: auto;
            max-height: 28vh;
            object-fit: contain;
            margin: clamp(0.5rem, 1.5vh, 2rem) 0;
            flex-shrink: 1;
            display: block;
            opacity: 0;
        }
        @keyframes banquetEyebrow {
            0%, 4% { opacity: 0; transform: translateY(20px); }
            20% { opacity: 1; transform: translateY(0); }
            76% { opacity: 1; transform: translateY(0); }
            90% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 0; transform: translateY(20px); }
        }
        @keyframes banquetTitle {
            0%, 10% { opacity: 0; transform: scale(0.95); }
            30% { opacity: 1; transform: scale(1); }
            76% { opacity: 1; transform: scale(1); }
            90% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 0; transform: scale(0.95); }
        }
        @keyframes banquetTagline {
            0%, 16% { opacity: 0; transform: translateY(-20px); }
            32% { opacity: 1; transform: translateY(0); }
            76% { opacity: 1; transform: translateY(0); }
            90% { opacity: 0; transform: translateY(-20px); }
            100% { opacity: 0; transform: translateY(-20px); }
        }
        .banquet-hero--visible .banquet-hero__eyebrow {
            animation: banquetEyebrow 5s ease infinite;
        }
        .banquet-hero--visible .banquet-hero__title-img {
            animation: banquetTitle 5s ease infinite;
        }
        .banquet-hero--visible .banquet-hero__tagline {
            animation: banquetTagline 5s ease infinite;
        }
        footer {
            padding: 60px 40px;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
        }
        .theme-toggle {
            position: fixed;
            bottom: 24px; right: 24px;
            z-index: 1001;
            width: 40px; height: 40px;
            background: var(--card-bg);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid var(--border);
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .theme-toggle:hover { transform: scale(1.1); }
        .theme-toggle svg { width: 20px; height: 20px; fill: var(--text); transition: opacity 0.3s ease; }
        .moon-icon { display: block; }
        .sun-icon { display: none; }
        [data-theme="light"] .moon-icon { display: none; }
        [data-theme="light"] .sun-icon { display: block; }
        /* Mobile menu button */
        .menu-btn {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            z-index: 1002;
        }
        .menu-btn span {
            display: block;
            width: 24px;
            height: 2px;
            background: var(--text);
            margin: 5px 0;
            transition: all 0.3s ease;
        }
        .mobile-nav {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg);
            z-index: 1001;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 32px;
        }
        .mobile-nav.active { display: flex; }
        .mobile-nav a {
            color: var(--text);
            text-decoration: none;
            font-size: 24px;
            font-weight: 500;
        }
        .close-menu {
            position: absolute;
            top: 30px;
            right: 20px;
            background: none;
            border: none;
            color: var(--text);
            font-size: 32px;
            cursor: pointer;
        }
        @media (max-width: 768px) {
            .header-content { padding: 0 20px; }
            header { padding: 20px 0; }
            nav { display: none; }
            .menu-btn { display: block; }
            main { padding-top: 70px; }
            .project-image { height: 40vh; min-height: 250px; }
            .project-title {
                opacity: 1;
                transform: translateY(0);
                font-size: 24px;
                bottom: 20px;
                left: 20px;
                flex-wrap: wrap;
            }
            .award-icon {
                width: 52px;
                height: 52px;
            }
            .project-card::before { opacity: 0.3; }
            footer { padding: 40px 20px; }
            .theme-toggle {
                bottom: 16px;
                right: 16px;
                width: 44px;
                height: 44px;
            }
            .banquet-hero__eyebrow,
            .banquet-hero__tagline {
                font-size: clamp(1rem, min(3.2vw, 3.5vh), 2rem);
                gap: clamp(0.5rem, 2vw, 2rem);
            }
            .banquet-hero__title-img {
                width: 65%;
                max-width: 350px;
                max-height: 16vh;
            }
            .banquet-hero__eyebrow::after,
            .banquet-hero__tagline::before {
                width: clamp(30px, 10vw, 120px);
            }
        }
        @media (max-width: 480px) {
            .project-image { height: 35vh; min-height: 200px; }
            .project-title { font-size: 20px; bottom: 16px; left: 16px; }
            .award-icon {
                width: 43px;
                height: 43px;
            }
            .banquet-hero__eyebrow,
            .banquet-hero__tagline {
                font-size: clamp(0.8rem, 3vw, 1.4rem);
            }
            .banquet-hero__title-img {
                width: 55%;
                max-width: 250px;
                max-height: 12vh;
            }
            .banquet-hero__eyebrow::after,
            .banquet-hero__tagline::before {
                width: clamp(20px, 8vw, 80px);
            }
        }
        header.hidden { transform: translateY(-100%); transition: transform 0.3s ease-in-out; }
        header:not(.hidden) { transform: translateY(0); transition: none; }

        /* ── FORMA BANNER (project card) — same block height as .project-image ── */
        .forma-banner {
            position: relative;
            width: 100%;
            height: 70vh;
            overflow: hidden;
            display: block;
            text-decoration: none;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            background: #090909;
            transition: background 0.35s ease;
        }
        [data-theme="light"] .forma-banner {
            background: #F7F4EF;
        }
        .project-card.forma-banner .project-title {
            z-index: 3;
            transition: color 0.35s ease, text-shadow 0.35s ease;
        }
        [data-theme="light"] .project-card.forma-banner .project-title {
            color: #111;
            text-shadow: 0 2px 14px rgba(247, 244, 239, 0.95), 0 1px 3px rgba(0, 0, 0, 0.12);
        }
        .forma-banner canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .forma-banner__content {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            filter: drop-shadow(0 1px 12px rgba(0,0,0,0.18));
            transition: filter 0.35s ease;
        }
        [data-theme="light"] .forma-banner__content {
            filter: drop-shadow(0 1px 14px rgba(247, 244, 239, 0.92)) drop-shadow(0 1px 3px rgba(0, 0, 0, 0.06));
        }
        .forma-banner__logo {
            font-family: 'Fraunces', Georgia, serif;
            font-optical-sizing: auto;
            font-weight: 300;
            font-style: normal;
            line-height: 1;
            letter-spacing: -0.025em;
            color: #d8d8d8;
            display: flex;
            align-items: baseline;
            transition: color 0.35s ease;
        }
        [data-theme="light"] .forma-banner__logo {
            color: #1a1a1a;
        }
        .forma-banner__logo .dot {
            font-style: italic;
            color: #E8622A;
        }
        .forma-banner__sub {
            font-family: 'Fraunces', Georgia, serif;
            font-weight: 300;
            letter-spacing: 0.01em;
            margin-top: 0.32em;
            color: rgba(210, 207, 202, 0.82);
            transition: opacity 0.35s ease, transform 0.35s ease, color 0.35s ease;
        }
        [data-theme="light"] .forma-banner__sub {
            color: rgba(55, 52, 48, 0.85);
        }
        .forma-banner__sub em {
            font-style: italic;
            color: #E8622A;
        }
        @media (hover: hover) {
            .forma-banner__sub {
                opacity: 0;
                transform: translateY(6px);
            }
            .forma-banner:hover .forma-banner__sub {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @media (hover: none) {
            .forma-banner__sub {
                opacity: 1;
                transform: none;
            }
        }
        /* Softer vignette on cream Forma card in light mode */
        [data-theme="light"] .project-card.forma-banner::before {
            background: radial-gradient(ellipse at center, transparent 0%, rgba(0, 0, 0, 0.18) 100%);
        }
        /*
         * Mobile heights MUST live after base .forma-banner { height: 70vh } or that rule wins.
         * Match .project-image exactly: 40vh / min 250 (tablet), 35vh / min 200 (phone).
         */
        @media (max-width: 768px) {
            .forma-banner {
                height: 40vh;
                min-height: 250px;
                box-sizing: border-box;
            }
            .forma-banner__content {
                padding: 0 clamp(14px, 5vw, 28px);
                text-align: center;
            }
            .forma-banner__sub {
                margin-top: 0.24em;
                max-width: 20rem;
                margin-left: auto;
                margin-right: auto;
            }
        }
        @media (max-width: 480px) {
            .forma-banner {
                height: 35vh;
                min-height: 200px;
            }
            .forma-banner__content {
                padding: 0 clamp(12px, 5vw, 22px);
            }
        }

        /* ── OVERPRINT BANNER (interactive 3D — iframe, title links out) ── */
        .overprint-banner {
            --overprint-inset: clamp(8px, 2vw, 18px);
            position: relative;
            width: 100%;
            height: 70vh;
            overflow: hidden;
            display: block;
            background: #050505;
        }
        /* Full-bleed link under iframe (ring outside iframe stays clickable). */
        .overprint-banner__site-link {
            position: absolute;
            inset: 0;
            z-index: 0;
        }
        /* Must set explicit width/height; width/height:auto collapses iframes to ~300×150 in some browsers. */
        .overprint-banner__frame {
            position: absolute;
            z-index: 1;
            top: var(--overprint-inset);
            left: var(--overprint-inset);
            width: calc(100% - 2 * var(--overprint-inset));
            height: calc(100% - 2 * var(--overprint-inset));
            border: 0;
            display: block;
        }
        .overprint-banner .project-title {
            z-index: 2;
            pointer-events: auto;
            text-decoration: none;
            color: #fff;
        }
        .overprint-banner .project-title:hover {
            opacity: 0.92;
        }
        [data-theme="light"] .overprint-banner {
            background: #fff;
        }
        [data-theme="light"] .overprint-banner .project-title {
            color: #111;
            text-shadow: none;
        }
        @media (max-width: 768px) {
            .overprint-banner {
                height: 40vh;
                min-height: 250px;
                box-sizing: border-box;
            }
        }
        @media (max-width: 480px) {
            .overprint-banner {
                height: 35vh;
                min-height: 200px;
            }
        }
    </style>
</head>

        <svg class="moon-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg class="sun-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="5" fill="#000"/>
            <line x1="12" y1="1" x2="12" y2="3" stroke="#000" stroke-width="2" stroke-linecap="round"/>
            <line x1="12" y1="21" x2="12" y2="23" stroke="#000" stroke-width="2" stroke-linecap="round"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" stroke="#000" stroke-width="2" stroke-linecap="round"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" stroke="#000" stroke-width="2" stroke-linecap="round"/>
            <line x1="1" y1="12" x2="3" y2="12" stroke="#000" stroke-width="2" stroke-linecap="round"/>
            <line x1="21" y1="12" x2="23" y2="12" stroke="#000" stroke-width="2" stroke-linecap="round"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" stroke="#000" stroke-width="2" stroke-linecap="round"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" stroke="#000" stroke-width="2" stroke-linecap="round"/>
        </svg>
    </button>
    <script>
        function syncOverprintIframeTheme() {
            const frame = document.getElementById('overprint-banner-frame');
            if (!frame || !frame.contentWindow) return;
            const light = document.documentElement.getAttribute('data-theme') === 'light';
            try {
                frame.contentWindow.postMessage({ type: 'overprint-theme', theme: light ? 'light' : 'dark' }, '*');
            } catch (e) {}
        }
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            syncOverprintIframeTheme();
        }
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        const overprintFrame = document.getElementById('overprint-banner-frame');
        if (overprintFrame) {
            overprintFrame.addEventListener('load', syncOverprintIframeTheme);
            try {
                if (overprintFrame.contentDocument && overprintFrame.contentDocument.readyState === 'complete') {
                    syncOverprintIframeTheme();
                }
            } catch (e) {}
        }
        let lastScrollTop = 0;
        const header = document.getElementById('main-header');
        const scrollThreshold = 100;
        window.addEventListener('scroll', function() {
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            if (scrollTop > scrollThreshold) {
                if (scrollTop > lastScrollTop) {
                    header.classList.add('hidden');
                } else if (scrollTop === 0) {
                    header.classList.remove('hidden');
                }
            } else {
                header.classList.remove('hidden');
            }
            lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
        });
        const hotsauceCard = document.getElementById('hotsauce-card');
        const hotsauceVideo = document.getElementById('hotsauce-video');
        hotsauceCard.addEventListener('mouseenter', function() { hotsauceVideo.muted = false; });
        hotsauceCard.addEventListener('mouseleave', function() { hotsauceVideo.muted = true; });

        // Banquet hero entrance animation
        const banquetHero = document.querySelector('.banquet-hero');
        if (banquetHero) {
            const banquetObs = new IntersectionObserver((entries, obs) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('banquet-hero--visible');
                        obs.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.3 });
            banquetObs.observe(banquetHero);
        }

        // Mobile nav
        function openMobileNav() {
            document.getElementById('mobile-nav').classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        function closeMobileNav() {
            document.getElementById('mobile-nav').classList.remove('active');
            document.body.style.overflow = '';
        }
    </script>
    <script>
(function() {
  function lerp3(a, b, t) {
    t = Math.max(0, Math.min(1, t));
    return [
      Math.round(a[0]+(b[0]-a[0])*t),
      Math.round(a[1]+(b[1]-a[1])*t),
      Math.round(a[2]+(b[2]-a[2])*t),
    ];
  }

  var canvas    = document.getElementById('forma-canvas');
  var banner    = document.getElementById('forma-card');
  var logoEl    = document.getElementById('forma-logo');
  if (!canvas || !banner) return;

  var ctx       = canvas.getContext('2d');
  var ORANGE    = [232, 98, 42];
  var isTouch   = window.matchMedia('(hover: none) and (pointer: coarse)').matches;

  function themePalette() {
    var light = document.documentElement.getAttribute('data-theme') === 'light';
    if (light) {
      return {
        neutral: [118, 108, 100],
        idleA: 0.28,
        idleB: 0.26,
        orangeCap: 0.78,
        orangeMix: 0.55,
        touchA: 0.28,
        touchB: 0.36
      };
    }
    return {
      neutral: [198, 194, 188],
      idleA: 0.26,
      idleB: 0.24,
      orangeCap: 0.75,
      orangeMix: 0.52,
      touchA: 0.26,
      touchB: 0.34
    };
  }
  var W=0, H=0, CX=0, CY=0;
  var mouse     = { x:-9999, y:-9999 };
  var smoothMouse = { x: -9999, y: -9999 };
  var hoverBlend= 0;
  var active    = false;
  var timeStart = 0;
  var rafId     = 0;
  var touchStart= null;

  function resize() {
    var dpr  = window.devicePixelRatio || 1;
    var rect = banner.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    canvas.width  = Math.round(rect.width  * dpr);
    canvas.height = Math.round(rect.height * dpr);
    canvas.style.width  = rect.width  + 'px';
    canvas.style.height = rect.height + 'px';
    W = rect.width; H = rect.height;
    CX = W/2; CY = H/2;
    if (logoEl) {
      /* Track banner box + viewport like Banquet (vh + min dimension), not width alone */
      var vhPx = window.innerHeight;
      var vminPx = Math.min(window.innerWidth, window.innerHeight);
      var isNarrow = W < 580;
      var hRatio = isNarrow ? 0.275 : 0.34;
      var wRatio = isNarrow ? 0.31 : 0.39;
      var fsIdeal = Math.min(H * hRatio, W * wRatio);
      var fsFloor = vminPx * (isNarrow ? 0.042 : 0.056);
      var fsCap = vhPx * 0.185;
      var fs = Math.round(Math.max(fsFloor, Math.min(fsIdeal, fsCap)));
      logoEl.style.fontSize = fs + 'px';
      var sub = logoEl.nextElementSibling;
      if (sub) sub.style.fontSize = Math.round(fs * 0.185) + 'px';
    }
  }

  function drawDesktop(now) {
    if (!ctx||!W||!H) return;
    var dpr = window.devicePixelRatio||1;
    var w   = canvas.width/dpr, h = canvas.height/dpr;
    var t   = timeStart ? (now-timeStart)/1000 : 0;
    var hbTarget = active ? 1 : 0;
    hoverBlend += (hbTarget - hoverBlend) * (active ? 0.09 : 0.14);
    if (active) {
      smoothMouse.x += (mouse.x - smoothMouse.x) * 0.22;
      smoothMouse.y += (mouse.y - smoothMouse.y) * 0.22;
    } else {
      smoothMouse.x += (mouse.x - smoothMouse.x) * 0.18;
      smoothMouse.y += (mouse.y - smoothMouse.y) * 0.18;
    }
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.save(); ctx.scale(dpr,dpr);
    var pal = themePalette();
    var NEUTRAL = pal.neutral;
    /* Halftone scale from banner short side (~pleasant at ref ≈ mid laptop / ~⅓ 16" window) */
    var ref = Math.min(w, h);
    var dotScale = Math.max(0.84, Math.min(1.38, ref / 540));
    var cell = Math.max(15, Math.min(40, ref * 0.034));
    var jScale = 0.88 + 0.12 * dotScale;
    var influence = Math.max(w * 0.2, ref * 0.4);
    var maxPush = Math.max(9, ref * 0.021);
    var hb=hoverBlend;
    for (var gx=cell/2; gx<w; gx+=cell) {
      for (var gy=cell/2; gy<h; gy+=cell) {
        var w1=Math.sin(gx*0.065+gy*0.048-t*1.15);
        var w2=Math.sin(gx*0.038-gy*0.072+t*0.92);
        var w3=Math.cos(gx*0.052+gy*0.061+t*0.78);
        var w4=Math.sin((gx+gy)*0.044-t*1.35);
        var wave=(w1+w2+w3+w4)*0.25;
        var px=gx+wave*2.8*jScale+Math.sin(gy*0.11-t*1.4)*1.6*jScale;
        var py=gy+Math.cos(gx*0.09+t*1.05)*2.2*jScale+wave*2*jScale;
        px+=Math.sin(t*4.2+gx*0.12)*0.65*jScale+Math.cos(t*3.4+gy*0.17)*0.5*jScale;
        py+=Math.cos(t*3.8+gx*0.09)*0.55*jScale+Math.sin(t*4.5+gy*0.11)*0.45*jScale;
        var mx = smoothMouse.x, my = smoothMouse.y;
        var dx=px-mx, dy=py-my;
        var dist=Math.sqrt(dx*dx+dy*dy);
        var ht=Math.max(0,1-dist/influence);
        if (hb*ht>0.01){var push=hb*ht*ht*maxPush,ang=Math.atan2(dy,dx);px+=Math.cos(ang)*push;py+=Math.sin(ang)*push;}
        var edgeDist=Math.min(px,w-px,py,h-py);
        var edgeFade=Math.min(1,edgeDist/(Math.max(w,h)*0.08));
        if (edgeFade<0.02) continue;
        var breathe=0.5+0.5*wave, baseR=(0.92+0.5*breathe)*dotScale;
        /* Card hover: all dots a bit larger; orange cursor glow noticeably larger */
        var hoverGrow = 1 + 0.08 * hb;
        var glowBoost = 1 + 0.28 * hb * ht * ht;
        baseR *= hoverGrow;
        var idleAlpha=(pal.idleA+pal.idleB*breathe)*edgeFade;
        if (hb*ht>0.02){
          var orangeT=Math.pow(ht,1.35)*hb, blendT=orangeT;
          var rgb=lerp3(NEUTRAL,ORANGE,blendT);
          var ar=(baseR+orangeT*3.05*dotScale)*glowBoost, alpha=Math.min(pal.orangeCap,idleAlpha+orangeT*pal.orangeMix)*edgeFade;
          ctx.beginPath();ctx.arc(px,py,ar,0,Math.PI*2);
          ctx.fillStyle='rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+','+alpha.toFixed(3)+')';ctx.fill();
        } else {
          ctx.beginPath();ctx.arc(px,py,baseR,0,Math.PI*2);
          ctx.fillStyle='rgba('+NEUTRAL[0]+','+NEUTRAL[1]+','+NEUTRAL[2]+','+idleAlpha.toFixed(3)+')';ctx.fill();
        }
      }
    }
    ctx.restore();
  }

  function drawTouch(elapsed) {
    if (!ctx||!W||!H) return;
    var dpr=window.devicePixelRatio||1, w=canvas.width/dpr, h=canvas.height/dpr, t=elapsed/1000;
    ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.scale(dpr,dpr);
    var pal = themePalette();
    var NEUTRAL = pal.neutral;
    var ref = Math.min(w, h);
    var dotScale = Math.max(0.84, Math.min(1.38, ref / 540));
    var SP = Math.max(15, Math.min(40, ref * 0.034));
    for (var gx=SP/2; gx<w; gx+=SP) {
      for (var gy=SP/2; gy<h; gy+=SP) {
        var edgeDist=Math.min(gx,w-gx,gy,h-gy), edgeFade=Math.min(1,edgeDist/(Math.max(w,h)*0.08));
        if (edgeFade<0.02) continue;
        var wave=Math.sin((gx*0.55+gy*0.45)/(w*0.75)*Math.PI*2-t*0.65*Math.PI*2);
        var norm=(wave+1)/2;
        var alpha=(pal.touchA+norm*pal.touchB)*edgeFade;
        if (alpha<0.01) continue;
        var isOrange=norm>0.76;
        var rgb=isOrange?lerp3(NEUTRAL,ORANGE,Math.min(1,(norm-0.76)/0.24)):NEUTRAL;
        var rDot = (1.18 + norm * 0.72) * dotScale;
        ctx.fillStyle='rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+','+alpha.toFixed(3)+')';
        ctx.beginPath();ctx.arc(gx,gy,rDot,0,Math.PI*2);ctx.fill();
      }
    }
  }

  if (!isTouch) {
    banner.addEventListener('mouseenter', function(e){
      active=true;
      var r=banner.getBoundingClientRect();
      mouse.x=e.clientX-r.left; mouse.y=e.clientY-r.top;
      smoothMouse.x=mouse.x; smoothMouse.y=mouse.y;
    });
    banner.addEventListener('mouseleave', function(){
      active=false;
    });
    banner.addEventListener('mousemove',  function(e){ var r=banner.getBoundingClientRect(); mouse.x=e.clientX-r.left; mouse.y=e.clientY-r.top; });
  }

  function tickDesktop(now){ drawDesktop(now); rafId=requestAnimationFrame(tickDesktop); }
  function tickTouch(ts){ if(!touchStart)touchStart=ts; drawTouch(ts-touchStart); rafId=requestAnimationFrame(tickTouch); }

  if (window.ResizeObserver) { new ResizeObserver(resize).observe(banner); }
  else { window.addEventListener('resize', resize); }

  document.fonts.ready.then(function(){
    resize();
    if (isTouch){ rafId=requestAnimationFrame(tickTouch); }
    else { timeStart=performance.now(); rafId=requestAnimationFrame(tickDesktop); }
  });
})();
    </script>
